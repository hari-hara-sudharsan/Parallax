[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# reactive-lib-omni requires ^0.8.29. Uniswap v4 uses transient storage → cancun.
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Scripts read .env values and write deployment JSON.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"

[fmt]
line_length = 120
